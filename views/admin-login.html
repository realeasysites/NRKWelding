<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NRK Admin Login</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0f;color:#fff;font-family:Inter,Arial,sans-serif;padding:16px}
  .card{width:100%;max-width:380px;background:#1a1b1f;border:1px solid #2c2f35;border-radius:14px;padding:28px;text-align:center}
  img{width:96px;height:96px;margin-bottom:12px}
  h1{font-size:20px;margin:0 0 18px}
  input{width:100%;padding:13px;border-radius:8px;border:1px solid #3a3d44;background:#0d0d0f;color:#fff;font-size:16px;margin-bottom:12px}
  button{width:100%;padding:13px;border:0;border-radius:8px;background:#f5b50a;color:#111;font-weight:800;font-size:16px;cursor:pointer}
  .err{color:#ff8a8a;min-height:20px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<form class="card" id="f">
  <img src="/images/logo-small.png" alt="NRK Welding LLC">
  <h1>Lead Dashboard</h1>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: document.getElementById('pw').value})});
    const j = await r.json();
    if (r.ok) location.href = '/admin'; else err.textContent = j.error || 'Could not sign in.';
  } catch (x) { err.textContent = 'Network problem. Try again.'; }
});
</script>
</body>
</html>
